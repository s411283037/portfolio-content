hero_intro: 結合商管邏輯與人文洞察，透過需求釐清、跨職能溝通與 AI 輔助實作，推進可檢視的專案成果。
about:
- 我就讀國立臺北大學，雙主修歷史與企業管理，關注 AI 如何應用於商務情境。人文訓練讓我習慣理解脈絡，商管學習則幫助我整理目標、限制與資源。
- 在企業合作專案中，我擔任 11 人團隊組長，負責對外溝通、協調分工及進度追蹤，也參與資料整理與 n8n 流程設計。開發經驗讓我理解，清楚的需求與規格是團隊合作的共同基礎。
- 我重視把事情推進，也願意回頭檢查自己的方法。曾因分工後缺乏共同理解而遇到進度落差，這讓我開始更重視原型、工作框架與及早求助。
